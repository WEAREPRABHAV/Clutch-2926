<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CLUTCH / 26 ? Admin</title>
    <style>
      html,
      body { min-height: 100%; margin: 0; background: #050505; color: #f6f3eb; font-family: system-ui, sans-serif; }
      .admin-loading { min-height: 100vh; display: grid; place-items: center; letter-spacing: 0.12em; font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <p class="admin-loading">LOADING ADMIN CONSOLE?</p>
    <script>
      history.replaceState(null, "", `${location.pathname}?admin=1`);
      fetch(new URL("index.html", location.href), { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`Could not load app (${response.status})`);
          return response.text();
        })
        .then((source) => {
          const cleanAddress = '<script>history.replaceState(null, "", location.pathname);<' + '/script>';
          document.open();
          document.write(source.replace("</head>", `${cleanAddress}</head>`));
          document.close();
        })
        .catch((error) => {
          console.error("Admin page failed to load:", error);
          document.body.innerHTML = '<p class="admin-loading">ADMIN CONSOLE COULD NOT LOAD. PLEASE REFRESH.</p>';
        });
    </script>
  </body>
</html>
